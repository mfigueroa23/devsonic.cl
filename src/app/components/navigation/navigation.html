<header class="fixed top-0 right-0 left-0 bg-transparent py-5">
  <nav class="container mx-auto px-6 flex items-center justify-between">

    <!-- Logo -->
    <a href="/#" class="text-xl font-bold tracking-tight hover:text-primary">
      MF<span class="text-primary">.</span>
    </a>

    <!-- Navigation Items -->
    <section class="flex items-center gap-1">
      <article class="glass rounded-full px-2 py-1 flex items-center gap-1">
        @for (link of navLinks; track $index) {
          <a href="{{ link.href }}" class="px-4 py-2 text-sm text-muted-foreground hover:text-foreground rounded-full hover:bg-surface">
            {{ link.label }}
          </a>
        }
      </article>
    </section>

    <!-- Contact Button -->
    <app-button size="sm">Contact Me</app-button>

  </nav>
</header>
