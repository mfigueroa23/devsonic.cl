<ng-template #content>
  <span class="relative flex items-center justify-center gap-2"><ng-content /></span>
</ng-template>

@if (href()) {
  <a href="{{ href() }}" class="{{ styles() }} inline-block">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button class="{{ styles() }}">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
